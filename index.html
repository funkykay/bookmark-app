<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta id="themeColor" name="theme-color" content="#f7f8fa">
  <title data-i18n="bookmarks"></title>
</head>
<body>
  <main id="bookmarksView" class="app" aria-labelledby="bookmarksTitle" hidden>
    <header>
      <h1 id="bookmarksTitle" tabindex="-1" data-i18n="bookmarks"></h1>
      <div class="actions">
        <button id="menuButton" class="icon-button" type="button" data-i18n-aria-label="moreOptions" aria-controls="popup" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg>
        </button>
        <div id="popup" class="popup" hidden>
          <button id="reorderButton" type="button" data-i18n="reorder"></button>
          <button id="labelsButton" type="button" data-i18n="labels"></button>
          <button id="settingsButton" type="button" data-i18n="settings"></button>
          <button id="lockButton" type="button" hidden data-i18n="lockNow"></button>
        </div>
        <button id="addButton" class="icon-button primary" type="button" data-i18n-aria-label="addBookmark">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </header>

    <div class="search-row">
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="7"/><path d="m16 16 5 5"/></svg>
        <input id="search" type="search" data-i18n-placeholder="search" autocomplete="off" data-i18n-aria-label="searchBookmarks">
      </div>
      <select id="labelFilter" class="label-filter" data-i18n-aria-label="filterByLabel" hidden></select>
      <div class="icon-button sort-control">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h12M3 11h8M3 16h4M17 9v11m-4-4 4 4 4-4"/></svg>
        <select id="sortOrder" data-i18n-aria-label="sortBookmarks">
          <option value="custom" data-i18n="customOrder" selected></option>
          <option value="updated" data-i18n="lastUpdated"></option>
        </select>
      </div>
    </div>
    <ul id="list" class="bookmarks" role="list"></ul>
    <div id="empty" class="empty" hidden>
      <span id="emptyText"></span>
      <button id="emptyAdd" type="button" data-i18n="add"></button>
    </div>
  </main>

  <main id="reorderView" class="app" aria-labelledby="reorderTitle" hidden>
    <header>
      <h1 id="reorderTitle" tabindex="-1" data-i18n="reorder"></h1>
      <button id="doneReorderButton" class="done-button" type="button" data-i18n="done"></button>
    </header>
    <ul id="reorderList" class="bookmarks" role="list"></ul>
    <span id="reorderAnnouncer" class="sr-only" role="status" aria-live="polite"></span>
    <p id="reorderEmpty" class="empty" hidden data-i18n="noBookmarks"></p>
  </main>

  <dialog id="editor" aria-labelledby="editorTitle">
    <form id="editorForm" class="dialog-inner" novalidate>
      <h2 id="editorTitle"></h2>
      <label class="field"><span data-i18n="name"></span><input id="nameInput" type="text" maxlength="100" autocomplete="off" required data-i18n-placeholder="name"></label>
      <label class="field"><span data-i18n="address"></span><input id="urlInput" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" required placeholder="https://"></label>
      <div class="field">
        <label for="labelInput" data-i18n="labels"></label>
        <div id="selectedLabels" class="label-badges"></div>
        <div class="label-entry">
          <input id="labelInput" type="text" list="labelSuggestions" autocomplete="off" data-i18n-placeholder="addLabel">
          <button id="assignLabel" class="icon-button" type="button" data-i18n-aria-label="addLabel" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <datalist id="labelSuggestions"></datalist>
      </div>
      <p id="error" class="error" role="alert"></p>
      <div class="dialog-actions">
        <button id="deleteButton" class="remove" type="button" hidden data-i18n="delete"></button>
        <button id="cancelButton" class="secondary" type="button" data-i18n="cancel"></button>
        <button class="save" type="submit" data-i18n="save"></button>
      </div>
    </form>
  </dialog>

  <main id="labelsView" class="app" aria-labelledby="labelsTitle" hidden>
    <header>
      <h1 id="labelsTitle" tabindex="-1" data-i18n="labels"></h1>
      <div class="actions">
        <button id="newLabel" class="icon-button primary" type="button" data-i18n-aria-label="addLabel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button id="backFromLabels" class="done-button" type="button" data-i18n="done"></button>
      </div>
    </header>
    <ul id="managedLabels" class="bookmarks" role="list"></ul>
    <p id="labelsEmpty" class="empty" data-i18n="noLabels"></p>
  </main>

  <dialog id="labelEditor" aria-labelledby="labelTitle">
    <form id="labelForm" class="dialog-inner">
      <h2 id="labelTitle"></h2>
      <label class="field"><span data-i18n="name"></span><input id="labelName" type="text" autocomplete="off" required></label>
      <label class="label-color-field"><span data-i18n="color"></span><input id="labelColor" type="color"></label>
      <p id="labelError" class="error" role="alert"></p>
      <div class="dialog-actions">
        <button id="deleteLabel" class="remove" type="button" data-i18n="delete" hidden></button>
        <button id="cancelLabel" class="secondary" type="button" data-i18n="cancel"></button>
        <button class="save" type="submit" data-i18n="save"></button>
      </div>
    </form>
  </dialog>

  <main id="settingsView" class="app" aria-labelledby="settingsTitle" hidden>
    <header>
      <h1 id="settingsTitle" tabindex="-1" data-i18n="settings"></h1>
      <button id="backFromSettings" class="done-button" type="button" data-i18n="back"></button>
    </header>
    <section class="settings-group" aria-labelledby="languageTitle">
      <h2 id="languageTitle" data-i18n="language"></h2>
      <select id="languageSelect" aria-labelledby="languageTitle">
        <option value="de" lang="de">Deutsch</option>
        <option value="en" lang="en">English</option>
      </select>
    </section>
    <section class="settings-group" aria-labelledby="appearanceTitle">
      <h2 id="appearanceTitle" data-i18n="appearance"></h2>
      <form id="appearanceForm">
        <fieldset>
          <legend data-i18n="mode"></legend>
          <div class="mode-options">
            <label><input class="sr-only" type="radio" name="mode" value="system" checked><span data-i18n="system"></span></label>
            <label><input class="sr-only" type="radio" name="mode" value="light"><span data-i18n="light"></span></label>
            <label><input class="sr-only" type="radio" name="mode" value="dark"><span data-i18n="dark"></span></label>
          </div>
        </fieldset>
        <fieldset>
          <legend data-i18n="palette"></legend>
          <div class="palette-options">
            <label><input class="sr-only" type="radio" name="palette" value="glacier" checked><span class="swatch glacier" data-i18n="glacier"></span></label>
            <label><input class="sr-only" type="radio" name="palette" value="lagoon"><span class="swatch lagoon" data-i18n="lagoon"></span></label>
            <label><input class="sr-only" type="radio" name="palette" value="sunset"><span class="swatch sunset" data-i18n="sunset"></span></label>
          </div>
        </fieldset>
      </form>
    </section>
    <section class="settings-group" aria-labelledby="securityTitle">
      <h2 id="securityTitle" data-i18n="security"></h2>
      <div class="pin-settings-row">
        <span data-i18n="pinProtection"></span>
        <button id="pinSwitch" type="button" class="pin-switch" role="switch" data-i18n-aria-label="pinProtection" aria-checked="false"></button>
      </div>
      <p id="pinUnavailable" class="pin-unavailable" hidden data-i18n="pinUnavailable"></p>
      <button id="changePinButton" class="settings-action" type="button" hidden data-i18n="changePin"></button>
    </section>
    <section class="settings-group" aria-labelledby="dataTitle">
      <h2 id="dataTitle" data-i18n="data"></h2>
      <button id="importButton" class="settings-action" type="button" data-i18n="importBookmarks"></button>
      <input id="importFile" type="file" accept=".json,application/json" hidden>
      <button id="exportButton" class="settings-action" type="button" data-i18n="exportBookmarks"></button>
      <button id="purgeButton" class="settings-action danger" type="button" data-i18n="purge"></button>
    </section>
  </main>

  <main id="pinGate" class="pin-gate" aria-labelledby="pinTitle" hidden>
    <div class="pin-gate-inner">
      <div class="pin-lock-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      </div>
      <h1 id="pinTitle" class="pin-title" tabindex="-1"></h1>
      <p id="pinHint" class="pin-hint"></p>
      <div id="pinDots" class="pin-dots">
        <span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span>
        <span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span>
      </div>
      <p id="pinFeedback" class="pin-feedback" role="status" aria-live="polite"></p>
      <div id="pinCountdown" class="pin-countdown" role="timer" hidden></div>
      <div id="pinKeypad" class="pin-keypad" data-i18n-aria-label="keypad">
        <button type="button" class="pin-key" data-digit="1">1</button>
        <button type="button" class="pin-key" data-digit="2">2</button>
        <button type="button" class="pin-key" data-digit="3">3</button>
        <button type="button" class="pin-key" data-digit="4">4</button>
        <button type="button" class="pin-key" data-digit="5">5</button>
        <button type="button" class="pin-key" data-digit="6">6</button>
        <button type="button" class="pin-key" data-digit="7">7</button>
        <button type="button" class="pin-key" data-digit="8">8</button>
        <button type="button" class="pin-key" data-digit="9">9</button>
        <span></span>
        <button type="button" class="pin-key" data-digit="0">0</button>
        <button type="button" class="pin-key erase" data-erase="true" data-i18n-aria-label="eraseDigit">⌫</button>
      </div>
      <button id="pinCancel" type="button" class="pin-cancel" hidden data-i18n="cancel"></button>
    </div>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
